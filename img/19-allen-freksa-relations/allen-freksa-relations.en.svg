<text x="90" y="838.0" font-family="Fira Sans" font-weight="500" font-size="16" fill="#2c2c2a">equal</text>
<text x="250.0" y="814.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID1 · Tüngeda (SBK) · −4800 – −4750</text>
<text x="250.0" y="892.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID2 · Goldbach (SBK) · −4800 – −4750</text>
<line x1="381.2" y1="818.0" x2="381.2" y2="872.0" stroke="#888780" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="818.8" y1="818.0" x2="818.8" y2="872.0" stroke="#888780" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="381.2" y="820.0" width="437.5" height="16" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
<rect x="381.2" y="846.0" width="437.5" height="16" rx="4" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.4"/>
<text x="1010" y="78" font-family="Fira Sans" font-weight="500" font-size="15" fill="#2c2c2a">What Freksa adds: relations under endpoint uncertainty</text>
<text x="1010" y="108" font-family="Fira Sans" font-size="12.3" fill="#2c2c2a">Every dating already carries a margin — datingCertaintyStart/End,</text>
<text x="1010" y="127" font-family="Fira Sans" font-size="12.3" fill="#2c2c2a">±10 to ±200 years depending on the site (see 06-uncertainty-dating).</text>
<text x="1010" y="146" font-family="Fira Sans" font-size="12.3" fill="#2c2c2a">A crisp Allen relation looks only at the two exact numbers and</text>
<text x="1010" y="165" font-family="Fira Sans" font-size="12.3" fill="#2c2c2a">ignores that margin. Freksa&apos;s semi-intervals split each interval</text>
<text x="1010" y="184" font-family="Fira Sans" font-size="12.3" fill="#2c2c2a">into a start-point and an end-point and ask where each point could</text>
<text x="1010" y="203" font-family="Fira Sans" font-size="12.3" fill="#2c2c2a">plausibly sit within its margin — narrowing the answer to a</text>
<text x="1010" y="222" font-family="Fira Sans" font-size="12.3" fill="#2c2c2a">neighbourhood of relations, rather than pinning down one.</text>
<text x="1010" y="261" font-family="Fira Sans" font-weight="500" font-size="13" fill="#2c2c2a">Worked example — the real ‘meets’ pair from the gallery</text>
<text x="1010" y="281" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">FID78 Nowe Objezierze 7 (SBK) meets FID153 Racot 18 (BKK) at −4350</text>
<rect x="1114.3" y="309.0" width="471.4" height="22" rx="4" fill="#f5dede" stroke="#a03030" stroke-width="1.2" opacity="0.75"/>
<text x="1020.0" y="305.0" font-family="Fira Sans" font-size="10" fill="#5f5e5a">Nowe Objezierze 7, end ±100y</text>
<rect x="1232.1" y="341.0" width="235.7" height="22" rx="4" fill="#a03030" stroke="#a03030" stroke-width="1.2" opacity="0.55"/>
<text x="1020.0" y="337.0" font-family="Fira Sans" font-size="10" fill="#5f5e5a">Racot 18, start ±50y</text>
<line x1="1350.0" y1="303.0" x2="1350.0" y2="381.0" stroke="#2c2c2a" stroke-width="1.4"/>
<text x="1350.0" y="395.0" text-anchor="middle" font-family="Fira Sans" font-size="10" fill="#2c2c2a">−4350 · crisp boundary</text>
<text x="1010" y="419" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a">→ depending on where the true boundary falls within the margin, ‘meets’ could really be:</text>
<rect x="1010.0" y="435.0" width="86" height="26" rx="13" fill="#f5dede" stroke="#a03030" stroke-width="1.3"/>
<text x="1053.0" y="448.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="12" fill="#a03030">before</text>
<rect x="1108.0" y="435.0" width="86" height="26" rx="13" fill="#f5dede" stroke="#a03030" stroke-width="1.3"/>
<text x="1151.0" y="448.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="12" fill="#a03030">meets</text>
<rect x="1206.0" y="435.0" width="86" height="26" rx="13" fill="#f5dede" stroke="#a03030" stroke-width="1.3"/>
<text x="1249.0" y="448.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="12" fill="#a03030">overlaps</text>
<text x="1010" y="485" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">The same ±10/50/100/200-year margins already in 06-uncertainty-dating would drive this — nothing new to measure.</text>
<rect x="1010.0" y="515.0" width="680.0" height="120.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1026.0" y="541.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Sketch, not a computation</text>
<text x="1026" y="557" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a">The relation names in the example above are stated by hand from</text>
<text x="1026" y="576" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a">the real ±100/±50-year margins, not derived from a point-algebra</text>
<text x="1026" y="595" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a">implementation. A full Freksa (1992) treatment is future work —</text>
<text x="1026" y="614" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a">not yet in queries.yaml or any .rq file.</text>
</svg>
