<text x="90" y="42" font-family="Fira Sans" font-size="13" font-style="italic" fill="#5f5e5a">Sketch — builds on the „opens Allen relations“ note in 06-uncertainty-dating; every value real, see FID references</text>
<text x="90" y="78" font-family="Fira Sans" font-weight="500" font-size="15" fill="#2c2c2a">Allen&apos;s 13 relations, seven canonical pairs</text>
<text x="90" y="96" font-family="Fira Sans" font-size="11" fill="#5f5e5a">Allen (1983) names, cited in English — grey = X (varies) · teal = R (reference)</text>
<text x="90" y="166.0" font-family="Fira Sans" font-weight="500" font-size="16" fill="#2c2c2a">before</text>
<text x="90" y="186.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">/ after</text>
<text x="250.0" y="142.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID40 · Bochow 16 (SBK) · −4804 – −4597</text>
<text x="250.0" y="220.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID32 · Steckelsdorf 12 (FBG) · −4550 – −3900</text>
<rect x="298.3" y="148.0" width="138.2" height="16" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
<rect x="467.8" y="174.0" width="433.9" height="16" rx="4" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.4"/>
<text x="90" y="278.0" font-family="Fira Sans" font-weight="500" font-size="16" fill="#2c2c2a">meets</text>
<text x="90" y="298.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">/ met-by</text>
<text x="250.0" y="254.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID78 · Nowe Objezierze 7 (SBK) · −4800 – −4350</text>
<text x="250.0" y="332.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID153 · Racot 18 (BKK) · −4350 – −3900</text>
<line x1="600.0" y1="258.0" x2="600.0" y2="312.0" stroke="#888780" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="298.3" y="260.0" width="301.7" height="16" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
