<text x="250.0" y="780.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID258 · Flemsdorf 10 (Rössener Kultur) · −4700 – −4450</text>
<line x1="901.7" y1="706.0" x2="901.7" y2="760.0" stroke="#888780" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="419.0" y="708.0" width="482.8" height="16" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
