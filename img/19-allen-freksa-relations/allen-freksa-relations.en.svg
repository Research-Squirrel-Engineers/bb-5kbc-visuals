<text x="90" y="390.0" font-family="Fira Sans" font-weight="500" font-size="16" fill="#2c2c2a">overlaps</text>
<text x="90" y="410.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">/ overlapped-by</text>
<text x="250.0" y="366.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID40 · Bochow 16 (SBK) · −4804 – −4597</text>
<text x="250.0" y="444.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID78 · Nowe Objezierze 7 (SBK) · −4800 – −4350</text>
<rect x="298.3" y="372.0" width="275.1" height="16" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
<rect x="303.6" y="398.0" width="598.1" height="16" rx="4" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.4"/>
<text x="90" y="502.0" font-family="Fira Sans" font-weight="500" font-size="16" fill="#2c2c2a">starts</text>
<text x="90" y="522.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">/ started-by</text>
<text x="250.0" y="478.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID1 · Tüngeda (SBK) · −4800 – −4750</text>
<text x="250.0" y="556.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID78 · Nowe Objezierze 7 (SBK) · −4800 – −4350</text>
<line x1="298.3" y1="482.0" x2="298.3" y2="536.0" stroke="#888780" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="298.3" y="484.0" width="67.0" height="16" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
<rect x="298.3" y="510.0" width="603.4" height="16" rx="4" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.4"/>
<text x="90" y="614.0" font-family="Fira Sans" font-weight="500" font-size="16" fill="#2c2c2a">during</text>
<text x="90" y="634.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">/ contains</text>
<text x="250.0" y="590.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID40 · Bochow 16 (SBK) · −4804 – −4597</text>
<text x="250.0" y="668.0" font-family="Fira Sans" font-size="10.5" fill="#5f5e5a">FID305 · Eichhorst - 8 (Mesolithikum) · −8000 – −4000</text>
<rect x="780.4" y="596.0" width="31.2" height="16" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
<rect x="298.3" y="622.0" width="603.4" height="16" rx="4" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.4"/>
<text x="90" y="726.0" font-family="Fira Sans" font-weight="500" font-size="16" fill="#2c2c2a">finishes</text>
<text x="90" y="746.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">/ finished-by</text>
