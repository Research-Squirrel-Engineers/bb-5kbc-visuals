<svg width="1750" height="1000" viewBox="0 0 1750 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How Kulturgruppe itself is modelled: a shared crm:E4_Period concept node</title>
<rect x="0" y="0" width="1750" height="1000" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-uncertain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a03030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="90.0" y="60.0" width="580.0" height="380.0" rx="10" fill="#eef0d6" stroke="#6b7a1f" stroke-width="1.8"/>
<text x="380.0" y="94.0" text-anchor="middle" font-family="Fira Sans" font-size="12" font-style="italic" fill="#2c2c2a" opacity="0.75">«crm:E4_Period»</text>
<text x="380.0" y="124.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="22" fill="#2c2c2a">Kulturgruppe</text>
<text x="380.0" y="147.0" text-anchor="middle" font-family="Fira Sans" font-size="13.5" fill="#5f5e5a">kultur_{hash} · geteilt / dedupliziert</text>
<line x1="90.0" y1="166.0" x2="670.0" y2="166.0" stroke="#6b7a1f" stroke-width="1.2"/>
<text x="120.0" y="208.0" font-family="Fira Sans" font-size="15" font-weight="500" fill="#2c2c2a">rdfs:label</text>
<text x="120.0" y="228.0" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">xsd:string @de = „FBG“</text>
<text x="120.0" y="276.0" font-family="Fira Sans" font-size="15" font-weight="500" fill="#2c2c2a">bb5kbc:hasExternalIdentifier</text>
<text x="120.0" y="296.0" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">URI = wd:Q&lt;Wikidata item&gt;</text>
<rect x="710.0" y="60.0" width="880.0" height="380.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="726.0" y="86.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Wie ein Kulturgruppe-Knoten entsteht</text>
<text x="736.0" y="114.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">Jeder distinkte String in der kultur-Spalte der CSV wird zu</text>
<text x="736.0" y="136.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">genau einem Knoten. Der Hash in der URI sind die ersten 8 Zeichen eines</text>
<text x="736.0" y="158.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">MD5-Digests über den Wert (UTF-8) — deterministisch, derselbe String</text>
<text x="736.0" y="180.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">führt immer zum selben Knoten, Umlaute kollidieren nie.</text>
<line x1="730.0" y1="222.0" x2="1570.0" y2="222.0" stroke="#dedcd4" stroke-width="1"/>
<text x="736.0" y="256.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">Mit echten Daten unterlegt: in der 540-zeiligen fst_wgs84.csv nimmt die</text>
<text x="736.0" y="278.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">kultur-Spalte 9 distinkte Werte an — 9 Kulturgruppe-Knoten tragen alle 540</text>
<text x="736.0" y="300.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">Fundstelle-zu-Kultur-Zuordnungen (per Counter() über die Spalte verifiziert,</text>
<text x="736.0" y="322.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">nicht geschätzt).</text>
<circle cx="620.0" cy="680.0" r="95.0" fill="#eef0d6" stroke="#6b7a1f" stroke-width="2"/>
<circle cx="620.0" cy="680.0" r="89.0" fill="none" stroke="#6b7a1f" stroke-width="1" opacity="0.55"/>
<text x="620.0" y="676.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="13.0" fill="#2c2c2a">„FBG“</text>
<text x="620.0" y="694.0" text-anchor="middle" font-family="Fira Sans" font-size="10.5" fill="#2c2c2a" opacity="0.75">kultur_a36e9d6d</text>
<rect x="90.0" y="535.0" width="190.0" height="50.0" rx="10" fill="#f4dde9" stroke="#9c2860" stroke-width="1.4"/>
<text x="185.0" y="552.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Fundstelle</text>
<text x="185.0" y="572.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">FID 32</text>
<path d="M 280.0 560.0 L 534.5 560.0 L 534.5 620.0" fill="none" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="90.0" y="625.0" width="190.0" height="50.0" rx="10" fill="#f4dde9" stroke="#9c2860" stroke-width="1.4"/>
<text x="185.0" y="642.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Fundstelle</text>
<text x="185.0" y="662.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">FID 33</text>
<path d="M 280.0 650.0 L 534.5 650.0 L 534.5 660.0" fill="none" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="90.0" y="715.0" width="190.0" height="50.0" rx="10" fill="#f4dde9" stroke="#9c2860" stroke-width="1.4"/>
<text x="185.0" y="732.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Fundstelle</text>
<text x="185.0" y="752.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">FID 61</text>
<path d="M 280.0 740.0 L 534.5 740.0 L 534.5 700.0" fill="none" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="90.0" y="805.0" width="190.0" height="50.0" rx="10" fill="#f4dde9" stroke="#9c2860" stroke-width="1.4"/>
<text x="185.0" y="822.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Fundstelle</text>
<text x="185.0" y="842.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">FID 77</text>
<path d="M 280.0 830.0 L 534.5 830.0 L 534.5 740.0" fill="none" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="90" y="490.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">Jede Fundstelle mit dieser Kultur hängt über eine eigene</text>
<text x="90" y="510.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">KulturelleZuordnung daran — alle laufen in diesem einen geteilten Knoten zusammen.</text>
<line x1="715.0" y1="680.0" x2="775.0" y2="680.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="831.0,695.0 805.0,710.0 779.0,695.0 779.0,665.0 805.0,650.0 831.0,665.0" fill="#e8e8e8" stroke="#666666" stroke-width="1.4"/>
<text x="805.0" y="680.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="9.5" fill="#2c2c2a">wd</text>
<text x="805.0" y="740.0" text-anchor="middle" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">eine Wikidata-QID</text>
<text x="805.0" y="758.0" text-anchor="middle" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">für jede FBG-Fundstelle</text>
<rect x="1050.0" y="480.0" width="580.0" height="420.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1066.0" y="506.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Erinnerung — die „?“-Variante ist ein eigener Knoten, dieselbe QID</text>
<circle cx="1180.0" cy="580.0" r="55.0" fill="#eef0d6" stroke="#6b7a1f" stroke-width="2"/>
<circle cx="1180.0" cy="580.0" r="49.0" fill="none" stroke="#6b7a1f" stroke-width="1" opacity="0.55"/>
<text x="1180.0" y="580.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="13.0" fill="#2c2c2a">„SBK“</text>
<circle cx="1180.0" cy="760.0" r="55.0" fill="#eef0d6" stroke="#a03030" stroke-width="2"/>
<circle cx="1180.0" cy="760.0" r="49.0" fill="none" stroke="#a03030" stroke-width="1" opacity="0.55"/>
<text x="1180.0" y="760.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="13.0" fill="#2c2c2a">„SBK?“</text>
<path d="M 1235.0 580.0 L 1362.0 580.0 L 1362.0 670.0" fill="none" stroke="#73726c" stroke-width="1.6"/>
<path d="M 1235.0 760.0 L 1362.0 760.0 L 1362.0 670.0" fill="none" stroke="#73726c" stroke-width="1.6"/>
<line x1="1362.0" y1="670.0" x2="1382.0" y2="670.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<polygon points="1434.2,684.0 1410.0,698.0 1385.8,684.0 1385.8,656.0 1410.0,642.0 1434.2,656.0" fill="#e8e8e8" stroke="#666666" stroke-width="1.4"/>
<text x="1410.0" y="670.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="9.5" fill="#2c2c2a">wd</text>
<text x="1076.0" y="840.0" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">Dieselbe QID, aber ein eigener Knoten — weil „SBK?“ die</text>
<text x="1076.0" y="862.0" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">Unsicherheits-Markierung fsl:certaintyDesc „uncertain“@en trägt.</text>
</svg>
