<svg width="1750" height="1000" viewBox="0 0 1750 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wikidata as the linking hub -- the four-stage geo-matching pipeline</title>
<rect x="0" y="0" width="1750" height="1000" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-uncertain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a03030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="265.0" y="70.0" width="260.0" height="96.0" rx="10" fill="#cfe2f3" stroke="#1e4f8a" stroke-width="1.4"/>
<text x="395.0" y="110.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">1 Index aufbauen</text>
<text x="395.0" y="130.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">SPARQL je Ebene</text>
<rect x="585.0" y="70.0" width="260.0" height="96.0" rx="10" fill="#cfe2f3" stroke="#1e4f8a" stroke-width="1.4"/>
<text x="715.0" y="110.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">2 Normalisieren</text>
<text x="715.0" y="130.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">Präfix-Strip + Alias</text>
<rect x="905.0" y="70.0" width="260.0" height="96.0" rx="10" fill="#cfe2f3" stroke="#1e4f8a" stroke-width="1.4"/>
<text x="1035.0" y="110.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">3 Override-Ebene</text>
<text x="1035.0" y="130.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">manuell verifiziert</text>
<rect x="1225.0" y="70.0" width="260.0" height="96.0" rx="10" fill="#cfe2f3" stroke="#1e4f8a" stroke-width="1.4"/>
<text x="1355.0" y="110.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">4 Fuzzy-Matching</text>
<text x="1355.0" y="130.0" text-anchor="middle" font-family="Fira Sans" font-size="9.5" fill="#2c2c2a" opacity="0.75">rapidfuzz, gestaffelt — siehe nächste Grafik</text>
<line x1="525.0" y1="118.0" x2="585.0" y2="118.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="845.0" y1="118.0" x2="905.0" y2="118.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="1165.0" y1="118.0" x2="1225.0" y2="118.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="265.0" y="192.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">Land/Bundesland: global, einmalig.</text>
<text x="265.0" y="210.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">Kreis: je Bundesland gescoped.</text>
<text x="585.0" y="192.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">„Landkreis X“ → X.</text>
<text x="585.0" y="210.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">Alias-Listen bewusst klein (1/2/2).</text>
<text x="905.0" y="192.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">Mehrdeutige / veraltete Namen.</text>
<text x="905.0" y="210.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">1 / 33 / 62 Einträge (BL/KR/GE).</text>
<text x="1225.0" y="192.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">token_sort_ratio, gestaffelte Schwellen.</text>
<text x="1225.0" y="210.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">matchReason: exact/fuzzy/override/transitive.</text>
<rect x="60.0" y="300.0" width="790.0" height="610.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="76.0" y="326.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Stufe 1: Index-Aufbau je Ebene</text>
<rect x="90.0" y="366.0" width="200.0" height="56.0" rx="10" fill="#cfe2f3" stroke="#1e4f8a" stroke-width="1.4"/>
<text x="190.0" y="394.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Land / Bundesland</text>
<text x="310.0" y="382.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Global, einmaliger SPARQL-Abruf über die gesamte Klasse</text>
<text x="310.0" y="401.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">(wdt:P31 souverainer Staat / Land in Deutschland / polnische</text>
<text x="310.0" y="420.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Woiwodschaft).</text>
<rect x="90.0" y="516.0" width="200.0" height="56.0" rx="10" fill="#cfe2f3" stroke="#1e4f8a" stroke-width="1.4"/>
<text x="190.0" y="544.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Kreis</text>
<text x="310.0" y="532.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Je Bundesland gescoped (wdt:P131 direkt, nicht transitiv) —</text>
<text x="310.0" y="551.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">ein einzelner globaler Abruf würde die SPARQL-Antwort über</text>
<text x="310.0" y="570.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">das Timeout-Limit des Endpunkts treiben.</text>
<rect x="90.0" y="666.0" width="200.0" height="56.0" rx="10" fill="#cfe2f3" stroke="#1e4f8a" stroke-width="1.4"/>
<text x="190.0" y="694.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Gemeinde</text>
<text x="310.0" y="682.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Je Kreis gescoped; siehe den zweistufigen Fallback für</text>
<text x="310.0" y="701.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Ortsteile, die an einer Zwischen-Gemeinde hängen statt direkt</text>
<text x="310.0" y="720.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">am Kreis.</text>
<rect x="90.0" y="826.0" width="700.0" height="68.0" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
<text x="440.0" y="852.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Zwei Schutzklauseln für jeden Index-Abruf</text>
<text x="440.0" y="872.0" text-anchor="middle" font-family="Fira Sans" font-size="9.0" fill="#2c2c2a" opacity="0.75">MINUS {{ ?item wdt:P582 [] }} schließt aufgelöste Einheiten aus — FILTER(STRLEN(?label) &gt; 3) verwirft KFZ-Kennzeichen als skos:altLabel</text>
<rect x="900.0" y="300.0" width="790.0" height="610.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="916.0" y="326.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Gemeinde-Ebene: zweistufiger SPARQL-Fallback</text>
<rect x="970.0" y="366.0" width="650.0" height="58.0" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
<text x="1295.0" y="387.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">CSV-Wert, z. B. „Babekuhl“</text>
<text x="1295.0" y="407.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">Gemeinde Putlitz, Landkreis Prignitz</text>
<line x1="1295.0" y1="424.0" x2="1295.0" y2="470.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="970.0" y="470.0" width="650.0" height="68.0" rx="10" fill="#cfe2f3" stroke="#1e4f8a" stroke-width="1.4"/>
<text x="1295.0" y="496.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Phase 1</text>
<text x="1295.0" y="516.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">P131 direkt, Index gescoped auf die Kreis-QID</text>
<line x1="1295.0" y1="538.0" x2="1295.0" y2="592.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1473.0" y="565.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">kein Treffer (Ortsteil hängt an Zwischen-Gemeinde)</text>
<rect x="970.0" y="592.0" width="650.0" height="68.0" rx="10" fill="#fff2cc" stroke="#7f6000" stroke-width="1.4"/>
<text x="1295.0" y="618.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Phase 2 (Fallback)</text>
<text x="1295.0" y="638.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">P131+ transitiv + exakter Label-Filter, 90-s-Timeout</text>
<rect x="970.0" y="710.0" width="305.0" height="68.0" rx="10" fill="#d9ead3" stroke="#3c763d" stroke-width="1.4"/>
<text x="1122.5" y="736.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Treffer</text>
<text x="1122.5" y="756.0" text-anchor="middle" font-family="Fira Sans" font-size="10.0" fill="#2c2c2a" opacity="0.75">matchReason=transitive, matchScore protokolliert</text>
<rect x="1315.0" y="710.0" width="305.0" height="68.0" rx="10" fill="#fff2cc" stroke="#7f6000" stroke-width="1.4"/>
<text x="1467.5" y="736.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Timeout → kein Treffer</text>
<text x="1467.5" y="756.0" text-anchor="middle" font-family="Fira Sans" font-size="9.0" fill="#2c2c2a" opacity="0.75">Lauf läuft weiter, matchReason=timeout, Triage-Report</text>
<path d="M 1152.0 660.0 L 1152.0 710.0 L 1122.5 710.0" fill="none" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1438.0 660.0 L 1438.0 710.0 L 1467.5 710.0" fill="none" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
