<svg width="1750" height="1000" viewBox="0 0 1750 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Absolute dating: real FID, real certainty values -- verified against the CSV</title>
<rect x="0" y="0" width="1750" height="1000" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-uncertain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a03030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="90" y="42" font-family="Fira Sans" font-size="13" font-style="italic" fill="#5f5e5a">FID 1 · „Tüngeda“ · kultur = SBK</text>
<rect x="90.0" y="55.0" width="650.0" height="470.0" rx="10" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.8"/>
<text x="415.0" y="87.0" text-anchor="middle" font-family="Fira Sans" font-size="12" font-style="italic" fill="#2c2c2a" opacity="0.75">«crm:E52_Time-Span»</text>
<text x="415.0" y="104.0" text-anchor="middle" font-family="Fira Sans" font-size="12" font-style="italic" fill="#2c2c2a" opacity="0.75">«time:Interval»</text>
<text x="415.0" y="133.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="21" fill="#2c2c2a">Dating</text>
<text x="415.0" y="155.0" text-anchor="middle" font-family="Fira Sans" font-size="13" fill="#5f5e5a">site_1_dating</text>
<line x1="90.0" y1="173.0" x2="740.0" y2="173.0" stroke="#3d7a2a" stroke-width="1.2"/>
<text x="120.0" y="207.0" font-family="Fira Sans" font-size="14.5" font-weight="500" fill="#2c2c2a">datingStart</text>
<text x="120.0" y="226.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">xsd:integer = −4800</text>
<text x="120.0" y="265.0" font-family="Fira Sans" font-size="14.5" font-weight="500" fill="#2c2c2a">datingEnd</text>
<text x="120.0" y="284.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">xsd:integer = −4750</text>
<text x="120.0" y="323.0" font-family="Fira Sans" font-size="14.5" font-weight="500" fill="#a03030">datingCertaintyStart</text>
<text x="120.0" y="342.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">xsd:string = „+/- 100 years“</text>
<text x="120.0" y="381.0" font-family="Fira Sans" font-size="14.5" font-weight="500" fill="#a03030">datingCertaintyEnd</text>
<text x="120.0" y="400.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">xsd:string = „+/- 100 years“</text>
<text x="120.0" y="439.0" font-family="Fira Sans" font-size="14.5" font-weight="500" fill="#a03030">datingCertaintyRange</text>
<text x="120.0" y="458.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">xsd:string = „low precision, as only stylistic dating“</text>
<rect x="860.0" y="75.0" width="320.0" height="64.0" rx="10" fill="#e4e8f0" stroke="#33456b" stroke-width="1.4"/>
<text x="1020.0" y="99.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">crm:E52_Time-Span</text>
<text x="1020.0" y="119.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">CRM-conformant time span</text>
<path d="M 740.0 170.0 L 740.0 107.0 L 860.0 107.0" fill="none" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="860.0" y="195.0" width="320.0" height="64.0" rx="10" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.4"/>
<text x="1020.0" y="219.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">time:Interval</text>
<text x="1020.0" y="239.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">owl-time:TemporalEntity</text>
<path d="M 740.0 320.0 L 740.0 227.0 L 860.0 227.0" fill="none" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="860.0" y="289.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">→ opens Allen relations: „Phase A ends</text>
<text x="860.0" y="307.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">before Phase B begins“</text>
<rect x="860.0" y="365.0" width="780.0" height="155.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="876.0" y="391.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Why 1:1 per Site, not shared?</text>
<text x="886.0" y="407.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">If Dating were deduplicated per Culture group (v0.10), all ~200 SBK sites would</text>
<text x="886.0" y="428.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">converge on the same dating node — individual start/end values would blend into an</text>
<text x="886.0" y="449.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">unrecoverable multi-set. End-to-end validation (validate_lod.py) surfaced this;</text>
<text x="886.0" y="470.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">from v0.11 the assignment is site-specific.</text>
<rect x="60.0" y="545.0" width="1630.0" height="400.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="76.0" y="571.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">dating_certainty_range: real free-text heterogeneity, with real counts (n=540)</text>
<text x="100.0" y="620.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">„low precision, as only stylistic dating“</text>
<rect x="720.0" y="593.0" width="285.0" height="22" rx="5" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.2"/>
<text x="1015.0" y="609.0" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">n=299</text>
<text x="100.0" y="662.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">„dating still very uncertain, for the whole group only few 14C dates available“</text>
<rect x="720.0" y="635.0" width="193.5" height="22" rx="5" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.2"/>
<text x="923.5" y="651.0" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">n=203</text>
<text x="100.0" y="704.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">„very uncertain, no dated features“</text>
<rect x="720.0" y="677.0" width="22.9" height="22" rx="5" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.2"/>
<text x="752.9" y="693.0" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">n=24</text>
<text x="100.0" y="746.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">„high certainty due to excessive radiocarbon dating and Bayesian modelling“</text>
<rect x="720.0" y="719.0" width="4.0" height="22" rx="5" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.2"/>
<text x="734.0" y="735.0" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">n=1</text>
<text x="100.0" y="779.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">+ 10 more distinct sentences, 1–2 rows each (e.g. „very certain because of detailed modelling of several 14C dates“) — full list in fst_wgs84_lit_enriched.csv.</text>
<line x1="100.0" y1="799.0" x2="1005.0" y2="799.0" stroke="#dedcd4" stroke-width="1"/>
<text x="100.0" y="825.0" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">By contrast: dating_certainty_start/end are clean today — they weren&apos;t always</text>
<text x="100.0" y="847.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">Today: all 540 rows filled, exactly 4 patterns — „+/- 100/50/200/10 years“.</text>
<text x="100.0" y="867.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">Before: 68 empty cells, plus spelling variants („+ / - 100 years“ vs. „+/- 200 years“) and a German variant („+ /- 100 Jahre“, 51 rows) — unified by Sophie.</text>
</svg>
