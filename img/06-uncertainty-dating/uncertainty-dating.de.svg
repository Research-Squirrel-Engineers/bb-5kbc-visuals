<text x="415.0" y="104.0" text-anchor="middle" font-family="Fira Sans" font-size="12" font-style="italic" fill="#2c2c2a" opacity="0.75">«time:Interval»</text>
<text x="415.0" y="133.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="21" fill="#2c2c2a">Datierung</text>
<text x="415.0" y="155.0" text-anchor="middle" font-family="Fira Sans" font-size="13" fill="#5f5e5a">site_1_dating</text>
<line x1="90.0" y1="173.0" x2="740.0" y2="173.0" stroke="#3d7a2a" stroke-width="1.2"/>
<text x="120.0" y="207.0" font-family="Fira Sans" font-size="14.5" font-weight="500" fill="#2c2c2a">datierungStart</text>
<text x="120.0" y="226.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">xsd:integer = −4800</text>
<text x="120.0" y="265.0" font-family="Fira Sans" font-size="14.5" font-weight="500" fill="#2c2c2a">datierungEnd</text>
<text x="120.0" y="284.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">xsd:integer = −4750</text>
<text x="120.0" y="323.0" font-family="Fira Sans" font-size="14.5" font-weight="500" fill="#a03030">datierungSicherheitStart</text>
<text x="120.0" y="342.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">xsd:string = „+/- 100 years“</text>
<text x="120.0" y="381.0" font-family="Fira Sans" font-size="14.5" font-weight="500" fill="#a03030">datierungSicherheitEnd</text>
<text x="120.0" y="400.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">xsd:string = „+/- 100 years“</text>
<text x="120.0" y="439.0" font-family="Fira Sans" font-size="14.5" font-weight="500" fill="#a03030">datierungSicherheitRange</text>
<text x="120.0" y="458.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">xsd:string = „low precision, as only stylistic dating“</text>
<rect x="860.0" y="75.0" width="320.0" height="64.0" rx="10" fill="#e4e8f0" stroke="#33456b" stroke-width="1.4"/>
<text x="1020.0" y="99.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">crm:E52_Time-Span</text>
<text x="1020.0" y="119.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">CRM-konforme Zeitspanne</text>
<path d="M 740.0 170.0 L 860.0 170.0 L 860.0 107.0" fill="none" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
