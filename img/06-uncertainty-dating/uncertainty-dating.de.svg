<text x="1020.0" y="239.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">owl-time:TemporalEntity</text>
<path d="M 740.0 320.0 L 860.0 320.0 L 860.0 227.0" fill="none" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="860.0" y="289.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">→ öffnet Allen-Relationen: „Phase A endet,</text>
<text x="860.0" y="307.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">bevor Phase B beginnt“</text>
<rect x="860.0" y="365.0" width="780.0" height="155.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="876.0" y="391.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Warum 1:1 zur Fundstelle, nicht geteilt?</text>
<text x="886.0" y="407.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Wäre Datierung pro Kulturgruppe dedupliziert (v0.10), lägen alle ~200 SBK-</text>
<text x="886.0" y="428.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Fundstellen am selben Datierungs-Knoten — individuelle Start/End-Werte würden sich zu</text>
<text x="886.0" y="449.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">einem nicht mehr auflösbaren Multi-Set vermischen. Die End-to-End-Validierung</text>
<text x="886.0" y="470.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">(validate_lod.py) deckte das auf; ab v0.11 ist die Zuordnung site-spezifisch.</text>
<rect x="60.0" y="545.0" width="1630.0" height="400.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="76.0" y="571.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">dating_certainty_range: echte Freitext-Heterogenität, mit echten Häufigkeiten (n=540)</text>
<text x="100.0" y="620.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">„low precision, as only stylistic dating“</text>
<rect x="720.0" y="593.0" width="940.0" height="22" rx="5" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.2"/>
<text x="1670.0" y="609.0" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">n=299</text>
<text x="100.0" y="662.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">„dating still very uncertain, for the whole group only few 14C dates available“</text>
<rect x="720.0" y="635.0" width="638.2" height="22" rx="5" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.2"/>
<text x="1368.2" y="651.0" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">n=203</text>
<text x="100.0" y="704.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">„very uncertain, no dated features“</text>
<rect x="720.0" y="677.0" width="75.5" height="22" rx="5" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.2"/>
<text x="805.5" y="693.0" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">n=24</text>
<text x="100.0" y="746.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">„high certainty due to excessive radiocarbon dating and Bayesian modelling“</text>
<rect x="720.0" y="719.0" width="4.0" height="22" rx="5" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1.2"/>
<text x="734.0" y="735.0" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">n=1</text>
<text x="100.0" y="779.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">+ 10 weitere distinkte Sätze, je 1–2 Zeilen (z. B. „very certain because of detailed modelling of several 14C dates“) — volle Liste in fst_wgs84_lit_enriched.csv.</text>
<line x1="100.0" y1="799.0" x2="1660.0" y2="799.0" stroke="#dedcd4" stroke-width="1"/>
<text x="100.0" y="825.0" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">Zum Vergleich: dating_certainty_start/end sind heute sauber — waren es nicht immer</text>
<text x="100.0" y="847.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">Heute: alle 540 Zeilen gefüllt, genau 4 Muster — „+/- 100/50/200/10 years“.</text>
<text x="100.0" y="867.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">Früher: 68 leere Zellen, plus Schreibvarianten („+ / - 100 years“ vs. „+/- 200 years“) und eine deutsche Variante („+ /- 100 Jahre“, 51 Zeilen) — von Sophie vereinheitlicht.</text>
</svg>
