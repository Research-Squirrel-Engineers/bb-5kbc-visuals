<svg width="1750" height="1000" viewBox="0 0 1750 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>What happens when a w3id.org/bb5kbc URI is dereferenced</title>
<rect x="0" y="0" width="1750" height="1000" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-uncertain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a03030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="60" y="60" font-family="Fira Sans" font-size="15.5" fill="#2c2c2a">w3id.org ist ein Redirect-Dienst: zwei Regeln in der .htaccess entscheiden, wohin eine bb5kbc-URI zeigt.</text>
<rect x="60.0" y="120.0" width="780.0" height="700.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="76.0" y="146.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Ontologie-Begriffe (http://w3id.org/bb5kbc/ont/...)</text>
<rect x="100.0" y="180.0" width="700.0" height="90.0" rx="10" fill="#f4dde9" stroke="#9c2860" stroke-width="2.0"/>
<text x="450.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">http://w3id.org/bb5kbc/ont/Fundstelle</text>
<line x1="450.0" y1="270.0" x2="450.0" y2="400.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="507.3" y="335.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="13" fill="#2c2c2a">303 See Other</text>
<text x="100.0" y="340.0" font-family="Fira Sans" font-size="11" fill="#5f5e5a">[NE]-Flag: verhindert doppeltes URL-Escaping beim Rewrite</text>
<rect x="100.0" y="400.0" width="700.0" height="100.0" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text x="450.0" y="450.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">.../ontology/index.html#Fundstelle</text>
<text x="100.0" y="540.0" font-family="Fira Sans" font-size="13" fill="#2c2c2a">Ein einziges HTML-Dokument für die</text>
<text x="100.0" y="564.0" font-family="Fira Sans" font-size="13" fill="#2c2c2a">gesamte Ontologie — jeder Begriff</text>
<text x="100.0" y="588.0" font-family="Fira Sans" font-size="13" fill="#2c2c2a">ist ein Fragment-Anker darin.</text>
<rect x="910.0" y="120.0" width="780.0" height="700.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="926.0" y="146.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Daten-Ressourcen (http://w3id.org/bb5kbc/site_*)</text>
<rect x="950.0" y="180.0" width="700.0" height="90.0" rx="10" fill="#f4dde9" stroke="#9c2860" stroke-width="2.0"/>
<text x="1300.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">http://w3id.org/bb5kbc/site_142</text>
<line x1="1300.0" y1="270.0" x2="1300.0" y2="400.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1357.3" y="335.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="13" fill="#2c2c2a">303 See Other</text>
<text x="950.0" y="340.0" font-family="Fira Sans" font-size="11" fill="#5f5e5a">[NE]-Flag: verhindert doppeltes URL-Escaping beim Rewrite</text>
<rect x="950.0" y="400.0" width="700.0" height="100.0" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text x="1300.0" y="450.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">.../site_142/index.html</text>
<text x="950.0" y="540.0" font-family="Fira Sans" font-size="13" fill="#2c2c2a">Jede Fundstelle bekommt eine</text>
<text x="950.0" y="564.0" font-family="Fira Sans" font-size="13" fill="#2c2c2a">eigene, generierte Seite —</text>
<text x="950.0" y="588.0" font-family="Fira Sans" font-size="13" fill="#2c2c2a">540 individuelle index.html-Dateien.</text>
</svg>
