<svg width="1750" height="1000" viewBox="0 0 1750 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>validate_lod.py: four independent checks, plus a documentation-drift check</title>
<rect x="0" y="0" width="1750" height="1000" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-uncertain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a03030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="60" y="75" font-family="Fira Sans" font-size="15" fill="#2c2c2a">validate_lod.py prüft nach jedem Lauf fünf voneinander unabhängige Fragen:</text>
<text x="90.0" y="120.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#5f5e5a">Sektion</text>
<text x="260.0" y="120.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#5f5e5a">Ebene</text>
<text x="520.0" y="120.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#5f5e5a">Was geprüft wird</text>
<line x1="90" y1="134.0" x2="1690" y2="134.0" stroke="#dedcd4" stroke-width="1"/>
<rect x="90.0" y="156.0" width="50.0" height="34" rx="17" fill="#fff2cc" stroke="#7f6000" stroke-width="1.8"/>
<text x="115.0" y="173.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#7f6000">1</text>
<text x="260.0" y="174.0" font-family="Fira Sans" font-weight="500" font-size="14" fill="#2c2c2a">Strukturell</text>
<text x="520.0" y="174.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">SHACL-Konformität (Daten- und Bundle-Graph)</text>
<rect x="90.0" y="234.0" width="50.0" height="34" rx="17" fill="#fff2cc" stroke="#7f6000" stroke-width="1.8"/>
<text x="115.0" y="251.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#7f6000">2</text>
<text x="260.0" y="252.0" font-family="Fira Sans" font-weight="500" font-size="14" fill="#2c2c2a">CSV ↔ RDF</text>
<text x="520.0" y="252.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">Pro-Spalten-Tripel-Erwartungen, Audit-Spalten ausgeschlossen</text>
<rect x="90.0" y="312.0" width="50.0" height="34" rx="17" fill="#fff2cc" stroke="#7f6000" stroke-width="1.8"/>
<text x="115.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#7f6000">3</text>
<text x="260.0" y="330.0" font-family="Fira Sans" font-weight="500" font-size="14" fill="#2c2c2a">Ontologie</text>
<text x="520.0" y="330.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">genutzte vs. deklarierte Klassen und Properties</text>
<rect x="90.0" y="390.0" width="50.0" height="34" rx="17" fill="#fff2cc" stroke="#7f6000" stroke-width="1.8"/>
<text x="115.0" y="407.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#7f6000">4</text>
<text x="260.0" y="408.0" font-family="Fira Sans" font-weight="500" font-size="14" fill="#2c2c2a">CRM-Verankerung</text>
<text x="520.0" y="408.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">jede bb5kbc:-Klasse erreicht einen crm:E*-Vorfahren</text>
<rect x="90.0" y="468.0" width="50.0" height="34" rx="17" fill="#d9ead3" stroke="#3c763d" stroke-width="1.8"/>
<text x="115.0" y="485.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#3c763d">4b</text>
<text x="260.0" y="486.0" font-family="Fira Sans" font-weight="500" font-size="14" fill="#2c2c2a">Doku-Drift</text>
<text x="520.0" y="486.0" font-family="Fira Sans" font-size="13.5" fill="#2c2c2a">OWL-Vorfahren ↔ csv-mapping.md</text>
<text x="90" y="580.0" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">4b ist ein maschineller Abgleich gegen die Doku selbst — nicht gegen die Ontologie-Datei ein</text>
<text x="90" y="600.0" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">zweites Mal, sondern gegen csv-mapping.md: schleichendes Auseinanderlaufen von Modell und</text>
<text x="90" y="620.0" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">Beschreibung wird bei jedem Lauf sichtbar, nicht erst beim nächsten Review.</text>
<rect x="60.0" y="670.0" width="1630.0" height="220.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="76.0" y="696.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">SHACL-Shapes: eine harte Regel, alles andere ist Warning</text>
<rect x="100.0" y="730.0" width="640.0" height="100.0" rx="10" fill="#f5dede" stroke="#a03030" stroke-width="2.0"/>
<text x="420.0" y="772.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">sh:Violation (hart)</text>
<text x="420.0" y="792.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">jede Fundstelle braucht genau ein hatFID</text>
<rect x="820.0" y="730.0" width="830.0" height="100.0" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
<text x="1235.0" y="772.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">sh:Warning (alles andere)</text>
<text x="1235.0" y="792.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">Domain-/Range-Constraints, weil externe URIs (z. B. Wikidata) keinen RDF-Typ tragen</text>
<text x="100.0" y="864.0" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">Ein harter Range-Check würde bei jedem externen Identifikator einen False Positive erzeugen.</text>
</svg>
