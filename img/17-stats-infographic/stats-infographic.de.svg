<text x="1174.5" y="760.0" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="12.5" fill="#2c2c2a">1</text>
<text x="60" y="850.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">Paper-Text nennt „neun Wojewodschaften“ und „350“ für Deutschland — beide Zählungen sind korrekt, nur an verschiedenen</text>
<text x="60" y="869.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">Pipeline-Stufen: 350 zählt die CSV-Spalte land vor der Fallback-Regel (12 leere Brandenburg-Zellen → Deutschland); diese Grafik</text>
<text x="60" y="888.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">zählt nach der immer vollständigen Spalte bundesland (350 + 12 = 362). Woj. Pomorskie (3 Fundstellen) ist real, keine</text>
<text x="60" y="907.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">Rundungskorrektur.</text>
<text x="60.0" y="946.0" font-family="Fira Sans" font-weight="500" font-size="18" fill="#2c2c2a">65</text>
<text x="60.0" y="966.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">CSV-Spalten</text>
<text x="460.0" y="946.0" font-family="Fira Sans" font-weight="500" font-size="18" fill="#2c2c2a">15</text>
<text x="460.0" y="966.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">Ontologie-Klassen</text>
<text x="860.0" y="946.0" font-family="Fira Sans" font-weight="500" font-size="18" fill="#2c2c2a">~21 700</text>
<text x="860.0" y="966.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">Tripel (Daten)</text>
<text x="1260.0" y="946.0" font-family="Fira Sans" font-weight="500" font-size="18" fill="#2c2c2a">~22 400</text>
<text x="1260.0" y="966.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">Tripel (Bundle)</text>
