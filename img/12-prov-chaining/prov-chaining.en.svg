<svg width="1750" height="1000" viewBox="0 0 1750 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PROV-O chaining: one Activity per run, linked across two pipeline stages</title>
<rect x="0" y="0" width="1750" height="1000" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-uncertain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a03030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="60.0" y="50.0" width="480.0" height="850.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="76.0" y="76.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Namespace https://example.org/bb-5kbc-sites/ (enrichment stage)</text>
<rect x="580.0" y="50.0" width="1110.0" height="850.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="596.0" y="76.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Namespace http://w3id.org/bb5kbc/ (LOD stage)</text>
<rect x="100.0" y="130.0" width="400.0" height="90.0" rx="10" fill="#fce5cd" stroke="#a86028" stroke-width="1.4"/>
<text x="300.0" y="167.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">csv_enrichment_run.ttl</text>
<text x="300.0" y="187.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">~90 triples</text>
<rect x="100.0" y="320.0" width="400.0" height="100.0" rx="10" fill="#fce5cd" stroke="#a86028" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="300.0" y="362.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">top-level Activity</text>
<text x="300.0" y="382.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">e.g. stage_literature</text>
<line x1="300.0" y1="220.0" x2="300.0" y2="320.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="100.0" y="442.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">no outgoing wasInformedBy edge</text>
<text x="100.0" y="500.0" font-family="Fira Sans" font-size="13" fill="#2c2c2a">The LOD stage looks for this file in its input directory,</text>
<text x="100.0" y="522.0" font-family="Fira Sans" font-size="13" fill="#2c2c2a">parses it and identifies the top-level Activity within it.</text>
<rect x="100.0" y="620.0" width="400.0" height="100.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="116.0" y="646.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780"></text>
<text x="116.0" y="658.0" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">No manifest found → standalone mode:</text>
<text x="116.0" y="678.0" font-family="Fira Sans" font-size="12.5" fill="#5f5e5a">own Activity, no chaining.</text>
<rect x="760.0" y="415.0" width="420.0" height="110.0" rx="10" fill="#d9ead3" stroke="#3c763d" stroke-width="2.0"/>
<text x="970.0" y="462.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">pipeline_run_2026-04-27T09-22-28Z</text>
<text x="970.0" y="482.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">«prov:Activity» · one Activity per run, not per row</text>
<line x1="760.0" y1="460.0" x2="500.0" y2="360.0" stroke="#a86028" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="625.0" y="423.1" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">wasInformedBy</text>
<rect x="760.0" y="130.0" width="420.0" height="78.0" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="1.4"/>
<text x="970.0" y="161.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Inputs (prov:used)</text>
<text x="970.0" y="181.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">fst_wgs84.csv + bb5kbc-ontology.ttl (file://)</text>
<line x1="970.0" y1="415.0" x2="970.0" y2="208.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1240.0" y="425.0" width="320.0" height="90.0" rx="10" fill="#e8e8e8" stroke="#666666" stroke-width="1.4"/>
<text x="1400.0" y="462.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">Agents (wasAssociatedWith)</text>
<text x="1400.0" y="482.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">2 × ORCID (authors) + software agent</text>
<line x1="1180.0" y1="470.0" x2="1240.0" y2="470.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="630.0" y="660.0" width="380.0" height="78.0" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text x="820.0" y="691.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">bb5kbc-data.ttl</text>
<text x="820.0" y="711.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">~21 700 triples</text>
<rect x="1060.0" y="660.0" width="380.0" height="78.0" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text x="1250.0" y="691.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14.0" fill="#2c2c2a">bb5kbc-bundle.ttl</text>
<text x="1250.0" y="711.0" text-anchor="middle" font-family="Fira Sans" font-size="11.5" fill="#2c2c2a" opacity="0.75">~22 400 triples</text>
<line x1="860.0" y1="525.0" x2="820.0" y2="660.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="890.9" y="607.6" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="11" fill="#2c2c2a">wasGeneratedBy</text>
<line x1="1080.0" y1="525.0" x2="1250.0" y2="660.0" stroke="#73726c" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="820.0" y1="660.0" x2="820.0" y2="208.0" stroke="#5f5e5a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="630.0" y="766.0" font-family="Fira Sans" font-size="11.5" fill="#5f5e5a">both: wasDerivedFrom → fst_wgs84.csv</text>
</svg>
