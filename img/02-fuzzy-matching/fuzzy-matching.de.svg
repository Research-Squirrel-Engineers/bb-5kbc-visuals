<text x="1300" y="384.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Dasselbe Präfix bei einem kurzen Namen zieht den</text>
<text x="1300" y="403.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Score unter die Schwelle — braucht erst den</text>
