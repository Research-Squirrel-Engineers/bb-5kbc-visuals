<text x="1300" y="206.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Ein kurzes Präfix bei einem langen Namen bewegt</text>
<text x="1300" y="225.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">den Score kaum — Fuzzy-Toleranz allein reicht</text>
<text x="1300" y="244.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">aus.</text>
