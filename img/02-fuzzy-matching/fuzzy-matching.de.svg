<text x="1210.3" y="749.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="13" fill="#a03030">DURCHGEFALLEN</text>
<text x="1300" y="740.0" font-family="Fira Sans" font-size="12.5" fill="#2c2c2a">Ein Akronym teilt fast keine Zeichen mit dem</text>
